services:

  postgres:
    image: postgres:17
    container_name: fraud-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - fraud-network

  kafka:
    image: confluentinc/cp-kafka:7.9.1
    container_name: fraud-kafka
    hostname: kafka

    restart: unless-stopped

    ports:
      - "127.0.0.1:${KAFKA_PORT}:9092"

    environment:

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list"
        ]
      interval: 10s
      timeout: 10s
      retries: 15

    networks:
      - fraud-network

  kafka-init:

    image: confluentinc/cp-kafka:7.9.1

    container_name: kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    restart: "no"

    entrypoint: /bin/sh

    command: -c "
      echo 'Creating Kafka topics...';

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.created --partitions 3 --replication-factor 1;

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.scored --partitions 3 --replication-factor 1;

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.flagged --partitions 3 --replication-factor 1;

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notifications.send --partitions 3 --replication-factor 1;

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic analytics.events --partitions 3 --replication-factor 1;

      echo 'Kafka initialization complete.';
      "

    networks:
      - fraud-network

  kafka-ui:

    image: provectuslabs/kafka-ui:v0.7.2

    container_name: kafka-ui

    restart: unless-stopped

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    ports:
      - "${KAFKA_UI_PORT}:8080"

    environment:

      KAFKA_CLUSTERS_0_NAME: fraud-platform

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

      DYNAMIC_CONFIG_ENABLED: "true"

    networks:
      - fraud-network

  pgadmin:

    image: dpage/pgadmin4:9.5

    container_name: fraud-pgadmin

    restart: unless-stopped

    ports:
      - "${PGADMIN_PORT}:80"

    environment:

      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}

      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin-data:/var/lib/pgadmin

    networks:
      - fraud-network

volumes:

  postgres-data:

  pgadmin-data:

networks:

  fraud-network:
    driver: bridge